name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates obrigatórios: falha aqui bloqueia o merge.
  gates:
    name: Gates obrigatórios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Testes (jest)
        run: npm run test:ci

      - name: Espelho da edge — igualdade do grafo
        run: npm run check-pricing-engine

      # PORTÃO DE SANIDADE, ao lado do de IGUALDADE e por exigência dele.
      #
      # `portao-que-nao-alcanca.md`, aparição 2: o check da cópia prova IGUALDADE entre os
      # arquivos, NUNCA que algum deles resolve seus imports. Dois arquivos igualmente
      # quebrados são iguais, e foi assim que um import morto chegou ao espelho com o carimbo
      # de conforme.
      #
      # Ele é BLOQUEANTE de propósito: nenhum outro portão do repositório alcança esta pasta.
      # O jest não a importa, o `next build` não a compila, e o `tsc` completo — o único que a
      # enxerga — roda no job de diagnóstico, com `continue-on-error`.
      - name: Espelho da edge — cada import resolve na pasta
        run: npm run check-edge-imports

      - name: Build (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Diagnóstico: informativo apenas. `typecheck` e `lint` têm centenas de erros
  # pré-existentes em main; rodamos para acompanhar a evolução sem bloquear o merge.
  diagnostics:
    name: Diagnóstico (não bloqueante)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (pré-existentes conhecidos)
        continue-on-error: true
        run: npm run typecheck

      - name: Lint (pré-existentes conhecidos)
        continue-on-error: true
        run: npm run lint
