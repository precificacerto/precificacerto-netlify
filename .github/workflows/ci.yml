name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates obrigatórios: falha aqui bloqueia o merge.
  gates:
    name: Gates obrigatórios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Testes (jest)
        run: npm run test:ci

      - name: Checksum do pricing-engine
        run: npm run check-pricing-engine

      - name: Build (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Diagnóstico: informativo apenas. `typecheck` e `lint` têm centenas de erros
  # pré-existentes em main; rodamos para acompanhar a evolução sem bloquear o merge.
  diagnostics:
    name: Diagnóstico (não bloqueante)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (pré-existentes conhecidos)
        continue-on-error: true
        run: npm run typecheck

      - name: Lint (pré-existentes conhecidos)
        continue-on-error: true
        run: npm run lint
